name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run full test suite
        run: npm test

      - name: Run native overlay contract tests
        run: npm run test:native-overlays

      - name: Build renderer and Electron bundles
        run: npm run build

  dependency-audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit packaged dependencies
        run: npm run audit:production

      - name: Audit development toolchain
        id: development-audit
        continue-on-error: true
        run: npm run audit:all

      - name: Explain development audit findings
        if: steps.development-audit.outcome == 'failure'
        run: |
          {
            echo "### Development dependency audit"
            echo
            echo "The complete audit found development-toolchain advisories."
            echo "The packaged-dependency audit remains the release-blocking check."
            echo "Review the preceding audit output before updating build tooling."
          } >> "$GITHUB_STEP_SUMMARY"
